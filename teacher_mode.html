<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Mode - Question Bank Editor</title>
  <link rel="stylesheet" href="teacher_mode.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Teacher Mode</h1>
      <p class="subtitle">Create and edit the question bank from the UI. Saved data is used by the main game automatically.</p>
      <div class="toolbar">
        <button id="addQuestionBtn" class="primary">+ Add Question</button>
        <button id="saveBtn" class="success">Save to Game</button>
        <button id="exportBtn" class="neutral">Export JSON</button>
        <label class="btn-file neutral">
          Import JSON
          <input id="importInput" type="file" accept=".json,application/json">
        </label>
        <button id="resetBtn" class="danger">Reset to JSON File</button>
        <a class="btn-link neutral" href="index.html">Back to Game</a>
      </div>
      <p id="status"></p>
      <p class="hint">Required format: 4 options per question and one valid correct index.</p>
    </section>

    <section class="panel">
      <div class="question-nav">
        <button id="prevQuestionBtn" class="neutral" type="button">← Previous</button>
        <div id="questionPosition" class="question-position">Question 1 of 1</div>
        <button id="nextQuestionBtn" class="neutral" type="button">Next →</button>
      </div>
      <div id="questionsContainer"></div>
    </section>
  </main>

  <script src="teacher_mode.js"></script>
</body>
</html>
